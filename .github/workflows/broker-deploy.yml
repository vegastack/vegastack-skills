name: Broker deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/broker/**"
      - ".github/workflows/broker-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which broker environment to deploy"
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: broker-deploy-${{ github.event.inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ github.event.inputs.environment || 'preview' }})
    # Self-hosted while GitHub-hosted runners are billing-locked (#57): on
    # ubuntu-latest every job died in ~3s having recorded ZERO steps, because the
    # runner never picked it up. Revert to `ubuntu-latest` together with ci.yml
    # and release.yml's --no-provenance flag, never one without the other.
    runs-on: [self-hosted, vsk-runners-mac]
    # `preview` on a merge to main is `preview: auto`; `production` carries a
    # required reviewer on the GitHub Environment, which is what makes
    # `production: ask` mechanical rather than a promise in a document.
    environment: ${{ github.event.inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (validate:skill + test + lint + typecheck)
        run: bun run check

      # The deploy guard: no storage binding, the App key only in the Secrets Store
      # binding, a custom domain rather than a workers.dev origin, and a rate limit
      # the platform can honour. It exits 2 until the operator fills in the store id.
      - name: Broker config guard
        run: node packages/broker/scripts/config-check.mjs --json

      - name: Deploy
        run: bun run --cwd packages/broker deploy:${{ github.event.inputs.environment || 'preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
