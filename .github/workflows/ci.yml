name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (node 24)
    # Self-hosted while GitHub-hosted runners are billing-locked (#57): on
    # ubuntu-latest every job died in ~3s having recorded ZERO steps, because the
    # runner never picked it up — a permanently red check that stops gating
    # anything. Revert to `ubuntu-latest` together with release.yml's runner and
    # its --no-provenance flag, never one without the other, once #57 clears.
    #
    # macOS means BSD userland. Audited before use: no `sed -i`, `date -d`,
    # `readlink -f`, `base64 -w`, `sort -V`, `grep -P` or `stat -c` anywhere in
    # this file, and `set -euo pipefail` is valid in macOS bash 3.2. The one real
    # hazard is the smoke test's target path — see the comment on TARGET_DIR.
    runs-on: [self-hosted, vsk-runners-mac]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Node 24 (LTS) is the single supported runtime: engines floor, CI, and release all match.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (validate:skill + test + lint + typecheck)
        run: bun run check

      - name: Build
        run: bun run build

      # Smoke-test the exact artifact npm would publish: pack a tarball,
      # install it into a clean temp project with npm, and run the installed bin.
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli

      - name: Packed-tarball smoke test
        run: |
          set -euo pipefail
          TARBALL=$(ls "$RUNNER_TEMP"/vegastack-vegafactory-*.tgz)
          # SMOKE_DIR is only npm's working directory and is never symlink-checked,
          # so mktemp is fine for it. TARGET_DIR is passed to `add --dir`, and the
          # CLI's assertNoSymlink (packages/cli/src/index.ts) refuses ANY symlinked
          # path component. On macOS `mktemp -d` returns /var/folders/…, and /var is
          # a symlink to /private/var, so it would fail there. RUNNER_TEMP lives in
          # the runner's own _work tree, and `pwd -P` resolves any symlinked
          # ancestor — correct on Linux too, so this survives the revert (#57).
          SMOKE_DIR=$(mktemp -d)
          TARGET_DIR="$(cd "$RUNNER_TEMP" && pwd -P)/vsk-smoke-target"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install "$TARBALL"
          ./node_modules/.bin/vegafactory --version
          ./node_modules/.bin/vegafactory skills add dev-architect \
            --dry-run --non-interactive --agent both --dir "$TARGET_DIR"
