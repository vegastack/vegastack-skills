name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the declared engines floor; 22/24 are current LTS/current.
        node: ["20.11.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (validate:skill + test + lint + typecheck)
        run: bun run check

      - name: Build
        run: bun run build

      # Smoke-test the exact artifact npm would publish: pack a tarball,
      # install it into a clean temp project with npm, and run the installed bin.
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli

      - name: Packed-tarball smoke test
        run: |
          set -euo pipefail
          TARBALL=$(ls "$RUNNER_TEMP"/vegastack-skills-*.tgz)
          SMOKE_DIR=$(mktemp -d)
          TARGET_DIR=$(mktemp -d)
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install "$TARBALL"
          ./node_modules/.bin/vegastack-skills --version
          ./node_modules/.bin/vegastack-skills add arch-guardian \
            --dry-run --non-interactive --agent both --dir "$TARGET_DIR"
