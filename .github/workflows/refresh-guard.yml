# Guards for automated refresh PRs (branches named refresh/**).
#
# The weekly refresh agent may only touch refresh metadata and the designated
# volatile files. Instructions do not prevent agent overreach; CI does:
#   1. scope-guard   — fail the PR if the diff touches anything outside the
#                      allowed paths.
#   2. re-verify     — deterministically re-run the version/checksum checks on
#                      the PR branch so agent-claimed values must reproduce.
#
# pull_request `branches:` filters on the BASE branch, so head-branch matching
# is done with a job-level `if:` on github.head_ref.

# NOTE: PRs opened by the weekly refresh workflow's default token do not
# trigger pull_request workflows (GitHub recursion prevention) — those runs
# self-verify inside refresh.yml instead. This guard fires on human-pushed
# refresh/** branches, and can be dispatched manually against any branch.

name: Refresh guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-guard:
    if: startsWith(github.head_ref, 'refresh/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if the diff leaves the refresh scope
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...")
          echo "Changed files:"
          echo "$CHANGED"
          OUT_OF_SCOPE=$(echo "$CHANGED" | grep -Ev \
            -e '^skills/([^/]+/)?[^/]+/refresh/' \
            || true)
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "::error::Refresh PRs may only touch skills/*/refresh/. Out of scope:"
            echo "$OUT_OF_SCOPE"
            exit 1
          fi
          echo "Scope OK."

  re-verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refresh/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # Online deterministic re-verification: re-fetches every source and compares
      # against the registry baselines the PR claims. A correctly accepted refresh
      # produces zero drift; hand-edited or hallucinated checksums/versions fail.
      # A scratch cache is used so results always compare against the registry,
      # never a stale local cache (none is committed anyway).
      - name: Deterministic re-verification
        run: |
          set -euo pipefail
          # The runner is repo-shared (tooling/refresh); every skill's
          # registry is re-verified.
          RUNNER=tooling/refresh/refresh-evidence.mjs
          SCRATCH=$(mktemp -d)
          mapfile -t REGISTRIES < <(find skills -path '*/refresh/sources.json' | sort)
          for REGISTRY in "${REGISTRIES[@]}"; do
            echo "== $REGISTRY"
            node "$RUNNER" --registry "$REGISTRY" --verify-baselines \
              --cache "$SCRATCH/evidence-cache-$(basename "$(dirname "$(dirname "$REGISTRY")")").json" \
              --report "$SCRATCH/evidence-drift-$(basename "$(dirname "$(dirname "$REGISTRY")")").json"
          done
          # Exit 0 tolerates NON-critical drift: a few sources (e.g. Google doc
          # properties) churn text per request, and blocking on them would flap.
          # Critical-source drift or unavailability still fails the job.
          echo "Critical baselines reproduce against the PR's registry."
