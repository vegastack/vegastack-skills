# Weekly deterministic refresh: re-verifies every skill's source registry,
# accepts changed baselines, and maintains ONE standing PR (branch
# refresh/weekly, force-updated — never stacked duplicates).
#
# This automates the deterministic layer only: checksums, versions, and
# retrieval timestamps, written by the runner in one code path. Semantic
# review — deciding whether a drifted source invalidates a marked sentence
# in skill content — happens in PR review, per each skill's
# refresh/REFRESH.md. The refresh-guard workflow enforces that the PR
# touches nothing outside the refresh scope and that claimed baselines
# reproduce.
#
# Thresholds in the registries are >= 14 days (2x this cadence), so one
# missed run never breaches a threshold.

name: Weekly refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Accept verified baselines for every skill registry
        run: |
          set -euo pipefail
          RUNNER=skills/arch-guardian/scripts/refresh-evidence.mjs
          SCRATCH=$(mktemp -d)
          mkdir -p "$SCRATCH/reports"
          for REGISTRY in skills/*/refresh/sources.json; do
            SKILL=$(basename "$(dirname "$(dirname "$REGISTRY")")")
            echo "== $SKILL"
            node "$RUNNER" --registry "$REGISTRY" --accept-baselines \
              --cache "$SCRATCH/cache-$SKILL.json" \
              --report "$SCRATCH/reports/$SKILL.json"
          done
          echo "SCRATCH=$SCRATCH" >> "$GITHUB_ENV"

      - name: Open or update the standing refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No baseline changes this week."
            exit 0
          fi
          # PR body: per-skill accepted-baseline evidence from the run reports.
          node -e '
            const { readdirSync, readFileSync, writeFileSync } = require("fs");
            const dir = process.env.SCRATCH + "/reports";
            let body = "Weekly deterministic refresh. Baselines below were re-fetched and accepted by the runner in this run — review any source whose skill content carries `<!-- source: ID -->` markers per that skill'"'"'s refresh/REFRESH.md before merging.\n";
            for (const file of readdirSync(dir)) {
              const report = JSON.parse(readFileSync(`${dir}/${file}`, "utf8"));
              if (!report.acceptedBaselines.length) continue;
              body += `\n### ${file.replace(/\.json$/, "")}\n`;
              for (const entry of report.acceptedBaselines) body += `- ${entry.id}${entry.currentVersion ? ` — version ${entry.currentVersion}` : ""}${entry.checksum ? " (checksum updated)" : ""}\n`;
            }
            writeFileSync(process.env.SCRATCH + "/pr-body.md", body);
          '
          git config user.name "vegastack-refresh[bot]"
          git config user.email "noreply@vegastack.com"
          git checkout -B refresh/weekly
          git add skills/*/refresh/sources.json
          git commit -m "chore(refresh): weekly deterministic baseline refresh"
          git push -f origin refresh/weekly
          if gh pr list --head refresh/weekly --state open --json number --jq length | grep -qv '^0$'; then
            gh pr edit refresh/weekly --body-file "$SCRATCH/pr-body.md"
            echo "Updated the standing refresh PR."
          else
            gh pr create --head refresh/weekly --base main \
              --title "chore(refresh): weekly deterministic baseline refresh" \
              --body-file "$SCRATCH/pr-body.md"
          fi
