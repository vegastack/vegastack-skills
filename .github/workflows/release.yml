# Release: publish @vegastack/vegafactory to npm and attach an SBOM to the GitHub release.
#
# ONE-TIME BOOTSTRAP (read before the first release):
#
#   Trusted publishing cannot be configured for a package that does not exist on
#   the registry yet. The FIRST-EVER publish of @vegastack/vegafactory must be done
#   manually with a short-lived granular access token:
#
#     1. On npmjs.com create a granular token scoped to the @vegastack org,
#        packages: read/write, short expiry.
#     2. Locally: cd packages/cli && npm publish --access public
#        (prepack builds via Bun; make sure `bun run check` passes first).
#     3. On npmjs.com, open the package settings for @vegastack/vegafactory and
#        configure a Trusted Publisher:
#          - provider:  GitHub Actions
#          - repository: vegastack/vegafactory
#          - workflow:  release.yml
#     4. Revoke the bootstrap token.
#
#   After that, this workflow publishes token-free via OIDC on every v* tag.
#   Provenance is generated by default under trusted publishing — do NOT add an
#   explicit --provenance flag; it conflicts with trusted-publishing config
#   (npm/cli#8036).
#
# Rollback policy: the ## Ship section of .vegastack/dev.md

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # OIDC token for npm trusted publishing.
  id-token: write
  # Create the GitHub release and attach the SBOM.
  contents: write

jobs:
  publish:
    # TEMPORARY (0.16.1, as for 0.14.0 and 0.16.0): GitHub-hosted runners are suspended by an
    # account-level billing lock — hosted jobs complete with zero steps executed, never having
    # started ("The job was not started because your account is locked due to a billing issue",
    # re-confirmed on a fresh run 01-09-2026). Self-hosted minutes are unmetered and do dispatch.
    #
    # Targets the repo-level macOS runners registered on the operator's machine
    # (`vsk-runner-mac-mk-1/2`, label `vsk-runners-mac`). The always-on Mac mini is the intended
    # host and is not registered yet (#119): its org runner group is `vsk-runners-mac-mini`, its
    # runner account is a different macOS user from the dispatcher account, and provisioning is
    # the control room's `onboarding/dispatcher-box.md`. Until the operator grants that group to
    # this repository and it lists an online runner, it is not reachable from here — a probe on
    # 01-09-2026 left all three org label sets queued indefinitely with `runner: null`, which is
    # how a missing runner-group grant presents (it queues forever rather than erroring). The
    # switch is the same two lines as in ci.yml, and it does NOT restore provenance: npm accepts
    # a provenance bundle only from a GitHub-hosted runner.
    #
    # macOS means BSD userland, which the steps below were not written for. Audited before use:
    # the changelog-extraction `awk` is pure POSIX, `grep -q '[^[:space:]]'` uses a POSIX class,
    # and there is no `sed -i`, `date -d`, `readlink -f`, `base64 -w` or `sort -V` anywhere.
    # Revert to `ubuntu-latest` — and drop --no-provenance below — once the lock clears (#57).
    runs-on: [self-hosted, vsk-runners-mac]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A v0.2.0 tag on a tree whose package.json still says 0.1.0 must fail here,
      # not publish the wrong version.
      - name: Verify both packages carry the tag version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          DASH_VERSION=$(node -p "require('./packages/dashboard/package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $PKG_VERSION"
            exit 1
          fi
          # `vegafactory dashboard` fetches @vegastack/vegafactory-dashboard at the CLI's own
          # version. Publishing a CLI whose dashboard version differs would ship a verb whose
          # first-use fetch resolves nothing.
          if [ "$DASH_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::packages/dashboard is at $DASH_VERSION but packages/cli is at $PKG_VERSION"
            exit 1
          fi

      - name: Check
        run: bun run check

      # Release notes lead with the human-written changeset entries for this
      # version; GitHub's generated commit notes are appended after the body.
      # A tag whose version has no changelog entry means `changeset version`
      # was skipped — fail HERE, before publish, so the bad version never
      # reaches the registry.
      - name: Extract changelog entry for release notes
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          awk -v ver="$VERSION" '
            $0 == "## " ver { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' packages/cli/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::packages/cli/CHANGELOG.md has no entry for $VERSION — run bunx changeset version before tagging"
            exit 1
          fi

      # Idempotent: the bootstrap release (and any workflow re-run) tags a version
      # that is already on the registry — skip the publish, still produce the
      # GitHub release + SBOM.
      - name: Publish to npm (trusted publishing, no token)
        working-directory: packages/cli
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@vegastack/vegafactory@$VERSION" version >/dev/null 2>&1; then
            echo "@vegastack/vegafactory@$VERSION is already on the registry; skipping publish."
          else
            # TEMPORARY (0.16.1), revert with the runs-on change above. npm refuses a
            # provenance bundle built anywhere but a GitHub-hosted runner, and hosted runners
            # are billing-locked. Auth is unaffected: still token-free trusted publishing
            # over OIDC. This ships 0.16.1 WITHOUT an attestation, on the operator's explicit
            # instruction of 01-09-2026 — the third such version, after 0.13.0 and 0.16.0.
            npm publish --access public --no-provenance
          fi

      # npm sbom needs an npm lockfile, which this Bun workspace does not keep.
      # Generate one transiently; the SBOM attests the build tree — the published
      # package itself has zero runtime dependencies. npm's resolver chokes on
      # Bun's node_modules/.bun layout, and --package-lock-only only needs
      # registry metadata, so clear the installed tree first (publish and check
      # already ran; nothing after this step needs node_modules).
      # The dashboard is the second published package: `vegafactory dashboard` fetches it at
      # the CLI's own version on first use, so the two must reach the registry together. Its
      # prepack runs `next build && assemble`, which is what fills dist-standalone.
      - name: Publish dashboard to npm (trusted publishing, no token)
        working-directory: packages/dashboard
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@vegastack/vegafactory-dashboard@$VERSION" version >/dev/null 2>&1; then
            echo "@vegastack/vegafactory-dashboard@$VERSION is already on the registry; skipping publish."
          else
            # TEMPORARY, with the same reason and the same revert as the CLI publish above:
            # npm refuses a provenance bundle built anywhere but a GitHub-hosted runner, and
            # hosted runners are billing-locked (#57). Auth is unaffected — still token-free
            # trusted publishing over OIDC.
            npm publish --access public --no-provenance
          fi

      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          rm -rf node_modules packages/cli/node_modules packages/dashboard/node_modules
          npm install --no-audit --no-fund
          npm sbom --sbom-format cyclonedx > sbom.json

      - name: Create GitHub release with SBOM
        uses: softprops/action-gh-release@v3
        with:
          files: sbom.json
          body_path: release-notes.md
          generate_release_notes: true
